<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container py-5">
        {# Navegación #}
        <div class="mb-4">
            <a href="{{ url_for('nuevo') }}" class="btn btn-info">Nuevo usuario</a>
            <a href="{{ url_for('usuarios') }}" class="btn btn-secondary">Todos los usuarios</a>
        </div>

        {# Detalle #}
        <div class="card shadow-sm col-12 col-md-6 mx-auto">
            <div class="card-body">
                <h2 class="card-title text-primary">
                    Usuario {{ usuario.id }}
                </h2>

                <p>
                    <strong>Nombre:</strong>
                    {{ usuario.nombre }}
                </p>

                <p>
                    <strong>Apellido:</strong>
                    {{ usuario.apellido }}
                </p>

                <p>
                    <strong>E-mail:</strong>
                    {{ usuario.email }}
                </p>
            </div>

            <div class="card-footer">
                <p>
                    <strong>Fecha de creación:</strong>
                    {{ usuario.created_at.strftime("%Y-%m-%d %H:%M:%S") }}
                </p>

                <div class="d-flex gap-2">
                    <a href="{{ url_for('editar', id=usuario.id) }}" class="btn btn-warning">Editar</a>
                    <a href="{{ url_for('borrar', id=usuario.id) }}" class="btn btn-danger" onclick="return confirm('¿Estás seguro de eliminar este usuario?');">Borrar</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
