<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container py-5">
        <form action="{{ url_for('actualizar', id=usuario.id) }}" method="POST"
            class="p-4 col-12 col-md-6 mx-auto border rounded shadow-sm">

            <h2 class="text-center text-primary mb-4">
                Editar usuario {{ usuario.id }}
            </h2>

            {# Nombre #}
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" name="nombre" id="nombre" class="form-control" value="{{ usuario.nombre }}" required>
            </div>

            {# Apellido #}
            <div class="mb-3">
                <label for="apellido" class="form-label">Apellido:</label>
                <input type="text" name="apellido" id="apellido" class="form-control" value="{{ usuario.apellido }}"
                    required>
            </div>

            {# E-mail #}
            <div class="mb-4">
                <label for="email" class="form-label">E-mail:</label>
                <input type="email" name="email" id="email" class="form-control" value="{{ usuario.email }}" required>
            </div>

            {# Botones #}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Actualizar Usuario</button>
                <a href="{{ url_for('detalle', id=usuario.id) }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</body>

</html>
