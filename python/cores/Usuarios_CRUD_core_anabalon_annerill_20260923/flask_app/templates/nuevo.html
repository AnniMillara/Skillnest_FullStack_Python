<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container py-5">
        {# Navegación #}
        <div class="mb-4">
            <a href="{{ url_for('usuarios') }}" class="btn btn-info">Ver todos los usuarios</a>
        </div>

        {# Formulario #}
        <form action="{{ url_for('crear') }}" method="POST"
            class="p-4 col-12 col-md-6 mx-auto border rounded shadow-sm">

            <h2 class="text-center text-primary mb-4">Crear Usuario</h2>

            <!-- NOMBRE -->
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" name="nombre" id="nombre" class="form-control" required>
            </div>

            <!-- APELLIDO -->
            <div class="mb-3">
                <label for="apellido" class="form-label">Apellido:</label>
                <input type="text" name="apellido" id="apellido" class="form-control" required>
            </div>

            <!-- E-MAIL -->
            <div class="mb-3">
                <label for="email" class="form-label">E-mail:</label>
                <input type="email" name="email" id="email" class="form-control" required>
            </div>

            <!-- BOTÓN -->
            <button type="submit" class="btn btn-primary">Crear usuario</button>
        </form>
    </div>
</body>

</html>
