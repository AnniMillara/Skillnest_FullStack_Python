{% extends "base.html" %}

{% block title %}Cursos{% endblock %}

{% block content %}

<h1 class="text-center mb-5">Cursos</h1>
<div class="row g-5">

    <div class="col-md-5">
        <h2 class="h5 mb-3">Nuevo Curso</h2>

        <form action="{{ url_for('ingresar_curso') }}" method="POST">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" name="nombre" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-dark">Crear curso</button>
        </form>
    </div>

    <div class="col-md-7">
        <h2 class="h5 mb-3">Todos los Cursos</h2>

        <div class="lista-cursos">
            {% if cursos %}
            {% for curso in cursos %}
            <div class="curso-item">
                <a href="{{ url_for('mostrar_curso', id=curso.id_curso) }}" class="curso-nombre">
                    {{ curso.nombre }}
                </a>
                <div class="curso-acciones">
                    <a href="{{ url_for('eliminar_curso', id=curso.id_curso) }}" class="btn btn-sm btn-outline-dark"
                        onclick="return confirm('¿Eliminar este curso?');">Eliminar</a>
                </div>
            </div>
            {% endfor %}
            {% else %}
            <span class="text-muted fst-italic">Aún no hay cursos registrados.</span>
            {% endif %}
        </div>

        <a href="{{ url_for('nuevo_estudiante') }}" class="d-inline-block mt-3 fw-semibold">
            Agregar Estudiante →
        </a>
    </div>

</div>

{% endblock %}
