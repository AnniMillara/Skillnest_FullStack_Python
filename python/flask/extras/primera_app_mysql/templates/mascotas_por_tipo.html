<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascotas por tipo</title>
</head>

<body>
    <h1>Mascotas de tipo "{{ tipo }}"</h1>

    <p>
        <a href="/">Inicio</a> |
        <a href="/usuarios">Ver Usuarios</a>
    </p>

    {% if mascotas %}
    <ul>
        {% for mascota in mascotas %}
        <li>
            <strong>{{ mascota.nombre }}</strong>
            - {{ mascota.tipo }}
            - {{ mascota.color }}
            <a href="/mascota/{{ mascota.id }}">Ver detalle</a>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No hay mascotas de este tipo.</p>
    {% endif %}
</body>

</html>
