<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Mascota</title>
</head>

<body>
    <h1>Detalle de la Mascota</h1>

    <p>
        <a href="/">Inicio</a> |
        <a href="/usuarios">Ver Usuarios</a>
    </p>

    <p><strong>Nombre:</strong> {{ mascota.nombre }}</p>
    <p><strong>Tipo:</strong> {{ mascota.tipo }}</p>
    <p><strong>Color:</strong> {{ mascota.color }}</p>
    <p><strong>ID:</strong> {{ mascota.id }}</p>
    <p><strong>Creado:</strong> {{ mascota.created_at }}</p>
    <p><strong>Actualizado:</strong> {{ mascota.updated_at }}</p>

    <a href="/">Volver al listado</a>
</body>

</html>
